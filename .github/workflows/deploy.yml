name: Deploy to Vercel

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Sync Environment Variables
        env:
          VERCEL_ENV: ${{ secrets.VERCEL_ENV }}
        run: |
          set -euo pipefail
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          # Fetch production env vars once (key -> id)
          existing=$(curl -sS -H "$AUTH" \
            "$API/v9/projects/$VERCEL_PROJECT_ID/env")

          sync_env_key() {
            local sync_key="$1"
            local sync_value="$2"
            echo "→ Syncing $sync_key"
            local env_id
            env_id=$(echo "$existing" | jq -r \
              --arg key "$sync_key" \
              '.envs[] | select(.key == $key and (.target | index("production"))) | .id' \
              | head -n 1)
            if [ -n "$env_id" ] && [ "$env_id" != "null" ]; then
              curl -sS -X DELETE -H "$AUTH" \
                "$API/v9/projects/$VERCEL_PROJECT_ID/env/$env_id" > /dev/null
            fi
            local status
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "$AUTH" -H "Content-Type: application/json" \
              "$API/v10/projects/$VERCEL_PROJECT_ID/env" \
              -d "$(jq -n --arg k "$sync_key" --arg v "$sync_value" \
                '{key:$k, value:$v, type:"encrypted", target:["production"]}')")
            if [ "$status" -ge 300 ]; then
              echo "✗ Failed to set $sync_key (HTTP $status)" >&2
              exit 1
            fi
          }

          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            key="${line%%=*}"
            value="${line#*=}"

            # Remove surrounding double quotes
            if [[ "$value" == \"*\" ]]; then
              value="${value#\"}"; value="${value%\"}"
            fi
            # Remove surrounding single quotes
            if [[ "$value" == \'*\' ]]; then
              value="${value#\'}"; value="${value%\'}"
            fi

            sync_env_key "$key" "$value"
            if [[ "$key" == VITE_* ]]; then
              sync_env_key "NEXT_PUBLIC_${key#VITE_}" "$value"
            fi
          done <<< "$VERCEL_ENV"

          existing=$(curl -sS -H "$AUTH" \
            "$API/v9/projects/$VERCEL_PROJECT_ID/env")
          echo "Mirroring existing VITE_* production env vars to NEXT_PUBLIC_* (Next.js client)..."
          while IFS= read -r legacy_key; do
            [ -z "$legacy_key" ] && continue
            next_key="NEXT_PUBLIC_${legacy_key#VITE_}"
            has_next=$(echo "$existing" | jq -r --arg k "$next_key" \
              '.envs[] | select(.key == $k and (.target | index("production"))) | .key' | head -n 1)
            [ -n "$has_next" ] && [ "$has_next" != "null" ] && continue
            legacy_value=$(echo "$existing" | jq -r --arg k "$legacy_key" \
              '.envs[] | select(.key == $k and (.target | index("production"))) | .value' | head -n 1)
            [ -z "$legacy_value" ] || [ "$legacy_value" = "null" ] && continue
            sync_env_key "$next_key" "$legacy_value"
          done < <(echo "$existing" | jq -r '.envs[].key | select(startswith("VITE_"))')

      - name: Configure Vercel project for Next.js
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/vercel-patch.json -w '%{http_code}' -X PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"framework":"nextjs","outputDirectory":null,"buildCommand":"npm run build"}')
          if [ "$status" -ge 300 ]; then
            echo "Failed to update Vercel project (HTTP $status):" >&2
            cat /tmp/vercel-patch.json >&2
            exit 1
          fi
          echo "Vercel project set to Next.js (outputDirectory cleared from legacy Vite dist)"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

 